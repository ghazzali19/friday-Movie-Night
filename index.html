<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friday Movie Night</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>🎬 Friday Movie Night</h1>

  <p class="info">📍 Building 6 Smart Classroom</p>
  <p class="info">🕡 Friday 18:30</p>

  <div class="card">
    <h2>Movie A</h2>
    <p id="hintA">Loading...</p>
    <button onclick="vote('A')">Vote A</button>
  </div>

  <div class="card">
    <h2>Movie B</h2>
    <p id="hintB">Loading...</p>
    <button onclick="vote('B')">Vote B</button>
  </div>

  <div class="results">
    <h2>📊 Live Results</h2>
    <p id="results">Loading...</p>
  </div>

  <div class="suggest">
    <h2>💡 Suggest a Movie</h2>

    <input id="name" placeholder="Your name">
    <input id="movie" placeholder="Movie suggestion">
    <input id="reason" placeholder="Why do you recommend it?">

    <button onclick="suggest()">Submit Suggestion</button>
  </div>

  <p id="msg"></p>

</div>

<script src="script.js"></script>

</body>
</html>
